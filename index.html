    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('nav-active'));
      document.getElementById(`page-${tabName}`).classList.remove('hidden');
      document.getElementById(`nav-${tabName}`).classList.add('nav-active');
    }

    function toggleSettingsModal() {
      const modal = document.getElementById('settings-modal');
      modal.classList.toggle('hidden');
      if (!modal.classList.contains('hidden')) {
        document.getElementById('input-pet-name').value = appConfig.petName || '';
        document.getElementById('input-address').value = appConfig.address || '';
        document.getElementById('input-bday').value = appConfig.bday || '';
        document.getElementById('input-homeday').value = appConfig.homeday || '';
      }
    }

    function toggleAddOutfitModal() {
      document.getElementById('add-outfit-modal').classList.toggle('hidden');
    }

    function getDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return (R * c).toFixed(1);
    }

    // 地名與區域 Key 識別
    function detectRegionKey(addr) {
      if (!addr) return "";
      if (addr.includes("中和") || addr.includes("景新街")) return "中和";
      if (addr.includes("台中") || addr.includes("臺中") || addr.includes("西屯") || addr.includes("逢甲")) return "台中";
      if (addr.includes("宜蘭") || addr.includes("羅東") || addr.includes("頭城")) return "宜蘭";
      if (addr.includes("高雄") || addr.includes("左營") || addr.includes("鼓山")) return "高雄";
      if (addr.includes("台北") || addr.includes("臺北") || addr.includes("大安")) return "台北";
      if (addr.includes("新北") || addr.includes("板橋")) return "新北";
      return "台北";
    }

    function getCityFallbackCoords(addr) {
      const key = detectRegionKey(addr);
      if (key === "中和") return { lat: 24.9920, lng: 121.5170 };
      if (key === "台中") return { lat: 24.1800, lng: 120.6450 };
      if (key === "宜蘭") return { lat: 24.7570, lng: 121.7530 };
      if (key === "高雄") return { lat: 22.6273, lng: 120.3014 };
      if (key === "新北") return { lat: 25.0135, lng: 121.4630 };
      return { lat: 25.0330, lng: 121.5654 };
    }

    async function geocodeAddress(addressText) {
      if (!addressText) return null;
      try {
        const query = addressText.includes("台灣") ? addressText : `台灣${addressText}`;
        const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`;
        const res = await fetch(url, { headers: { 'Accept-Language': 'zh-TW' } });
        const data = await res.json();
        if (data && data.length > 0) return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
      } catch (err) {}
      return getCityFallbackCoords(addressText);
    }

    async function saveSettings() {
      const newPetName = (document.getElementById('input-pet-name').value || '').trim();
      const newAddress = (document.getElementById('input-address').value || '').trim();

      appConfig.petName = newPetName;
      appConfig.address = newAddress;
      appConfig.regionKey = detectRegionKey(newAddress);

      if (newAddress) {
        document.getElementById('header-address').innerText = "📍 定位計算中...";
        let coords = await geocodeAddress(newAddress);
        if (!coords) coords = getCityFallbackCoords(newAddress);
        if (coords) {
          appConfig.userLat = coords.lat;
          appConfig.userLng = coords.lng;
        }
      } else {
        appConfig.userLat = null;
        appConfig.userLng = null;
        appConfig.regionKey = "";
      }

      localStorage.setItem('pet_app_strict_region_v4', JSON.stringify(appConfig));
      forceRenderAll();
      toggleSettingsModal();
    }

    function resetAppCache() {
      localStorage.removeItem('pet_app_strict_region_v4');
      appConfig = { petName: "", address: "", regionKey: "", userLat: null, userLng: null };
      forceRenderAll();
      toggleSettingsModal();
    }

    function forceRenderAll() {
      const pName = appConfig.petName || "毛孩";
      const pAddr = appConfig.address || "尚未設定地址 (點擊右上角⚙️設定)";

      document.getElementById('header-pet-name').innerText = appConfig.petName ? `${pName}的隨身 App` : "毛孩隨身 App";
      document.getElementById('header-address').innerText = pAddr;
      document.getElementById('outfit-pet-name').innerText = pName;

      if (!appConfig.userLat || !appConfig.userLng || !appConfig.regionKey) {
        const emptyTip = `<div class="text-center py-6 text-slate-400 text-xs">請點擊右上角「⚙️ 設定」輸入地址以計算距離</div>`;
        document.getElementById('park-distance-container').innerHTML = emptyTip;
        document.getElementById('restaurant-distance-container').innerHTML = emptyTip;
        document.getElementById('vet-distance-container').innerHTML = emptyTip;
        return;
      }

      const curRegion = appConfig.regionKey;

      // 1. 純區域過濾 - 公園
      const filteredParks = masterParks
        .filter(p => p.city === curRegion || (curRegion === "中和" && (p.city === "中和" || p.city === "新北")))
        .map(p => ({ ...p, dist: parseFloat(getDistanceKm(appConfig.userLat, appConfig.userLng, p.lat, p.lng)) }))
        .sort((a, b) => a.dist - b.dist);

      document.getElementById('park-distance-container').innerHTML = filteredParks.length ? filteredParks.map((p, idx) => `
        <div class="p-3 rounded-xl border border-slate-100 bg-slate-50 flex justify-between items-center my-2">
          <div>
            <div class="font-bold text-slate-800 flex items-center space-x-1">
              <span>${idx + 1}. ${p.name}</span>
              <span class="text-[10px] bg-indigo-100 text-indigo-700 px-1.5 py-0.5 rounded font-bold">📍 距約 ${p.dist} km</span>
            </div>
            <p class="text-slate-500 text-[11px] mt-0.5">${p.desc}</p>
          </div>
          <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name)}" target="_blank" class="px-2.5 py-1.5 bg-emerald-600 text-white font-bold rounded-lg text-[11px] shadow-sm shrink-0">🗺️ 導航</a>
        </div>
      `).join('') : `<div class="text-center py-4 text-slate-400 text-xs">此區域暫無登記的寵物公園</div>`;

      // 2. 純區域過濾 - 餐廳
      const filteredRests = masterRestaurants
        .filter(r => r.city === curRegion || (curRegion === "中和" && (r.city === "中和" || r.city === "新北")))
        .map(r => ({ ...r, dist: parseFloat(getDistanceKm(appConfig.userLat, appConfig.userLng, r.lat, r.lng)) }))
        .sort((a, b) => a.dist - b.dist);

      document.getElementById('restaurant-distance-container').innerHTML = filteredRests.length ? filteredRests.map((r, idx) => `
        <div id="rest-${idx+1}" class="p-3 rounded-xl border border-slate-100 bg-slate-50 flex justify-between items-center my-2">
          <div>
            <div class="font-bold text-slate-800 flex items-center space-x-1">
              <span>${idx + 1}. ${r.name}</span>
              <span class="text-amber-600 font-bold text-[10px]">📍 距約 ${r.dist} km</span>
            </div>
            <p class="text-slate-500 text-[11px] mt-0.5">${r.desc}</p>
          </div>
          <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(r.name)}" target="_blank" class="px-2.5 py-1.5 bg-emerald-600 text-white font-bold rounded-lg text-[11px] shadow-sm shrink-0">🗺️ 導航</a>
        </div>
      `).join('') : `<div class="text-center py-4 text-slate-400 text-xs">此區域暫無登記的寵物餐廳</div>`;

      // 3. 純區域過濾 - 醫院
      const filteredVets = masterVets
        .filter(v => v.city === curRegion || (curRegion === "中和" && (v.city === "中和" || v.city === "新北")))
        .map(v => ({ ...v, dist: parseFloat(getDistanceKm(appConfig.userLat, appConfig.userLng, v.lat, v.lng)) }))
        .sort((a, b) => a.dist - b.dist);

      document.getElementById('vet-distance-container').innerHTML = filteredVets.length ? filteredVets.map((v, idx) => `
        <div class="p-3 rounded-xl border border-rose-100 bg-rose-50/50 flex justify-between items-center my-2">
          <div>
            <div class="font-bold text-slate-800 flex items-center space-x-1">
              <span>${v.name}</span>
              <span class="text-rose-700 text-[10px] font-bold bg-rose-100 px-1.5 py-0.5 rounded">📍 距約 ${v.dist} km</span>
            </div>
            <p class="text-slate-500 text-[11px] mt-0.5">${v.desc}</p>
          </div>
          <a href="tel:${v.phone}" class="px-2.5 py-1.5 bg-rose-600 text-white font-bold rounded-lg text-[11px] shadow-sm shrink-0">📞 直撥</a>
        </div>
      `).join('') : `<div class="text-center py-4 text-slate-400 text-xs">此區域暫無登記的動物醫院</div>`;
    }

    // 穿搭與相廊邏輯
    function renderOutfitsUI() {
      const grid = document.getElementById('outfit-list-grid');
      if (!grid) return;
      grid.innerHTML = outfitsList.map((item, idx) => `
        <div class="p-2 border border-slate-200 bg-slate-50 rounded-xl flex justify-between items-center">
          <button onclick="selectOutfit('${item.name}')" class="text-left font-semibold text-slate-700 truncate flex items-center space-x-1">
            <span class="w-2.5 h-2.5 rounded-full inline-block border" style="background-color: ${item.color};"></span>
            <span>${item.name}</span>
          </button>
          ${outfitsList.length > 1 ? `<button onclick="deleteOutfit(${idx})" class="text-slate-400 hover:text-red-600 font-bold px-1 text-xs">✕</button>` : ''}
        </div>
      `).join('');
    }

    function saveNewOutfit() {
      const name = (document.getElementById('input-outfit-name').value || '').trim();
      const color = document.getElementById('input-outfit-color').value;
      const desc = (document.getElementById('input-outfit-desc').value || '').trim() || `${name} 服飾試穿`;

      if (!name) return alert("請輸入衣服名稱！");
      outfitsList.push({ name, color, desc });
      renderOutfitsUI();
      selectOutfit(name);
      toggleAddOutfitModal();
      document.getElementById('input-outfit-name').value = '';
    }

    function deleteOutfit(index) {
      outfitsList.splice(index, 1);
      renderOutfitsUI();
    }

    function selectOutfit(name) {
      const outfit = outfitsList.find(o => o.name === name) || outfitsList[0];
      if (outfit) {
        document.getElementById('outfit-description').innerText = outfit.desc;
        document.getElementById('outfit-svg-layer').innerHTML = `<path d="M 38 63 Q 50 55 105 58 Q 140 62 145 75 L 138 88 Q 90 92 42 82 Z" fill="${outfit.color}" opacity="0.9" />`;
      }
    }

    function handlePhotoUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        photosList.unshift(e.target.result);
        renderGallery();
      };
      reader.readAsDataURL(file);
    }

    function renderGallery() {
      const gallery = document.getElementById('photo-gallery');
      if (!gallery) return;
      if (photosList.length === 0) {
        gallery.innerHTML = `<div class="aspect-square bg-slate-100 rounded-xl border-2 border-dashed border-slate-200 flex flex-col items-center justify-center text-slate-400 text-xs col-span-2 py-8"><span>🖼️ 尚無照片，點擊右上角新增</span></div>`;
        return;
      }
      gallery.innerHTML = photosList.map((src, index) => `
        <div class="aspect-square bg-slate-900 rounded-xl overflow-hidden relative shadow group">
          <img src="${src}" class="w-full h-full object-cover">
          <button onclick="deletePhoto(${index})" class="absolute top-1 right-1 bg-red-600/80 hover:bg-red-600 text-white w-5 h-5 rounded-full text-[10px] flex items-center justify-center shadow">✕</button>
        </div>
      `).join('');
    }

    function deletePhoto(index) {
      photosList.splice(index, 1);
      renderGallery();
    }

    let currentWeight = 10.0;
    function adjustWeight(val) {
      currentWeight = Math.round((currentWeight + val) * 10) / 10;
      document.getElementById('weight-display').innerText = currentWeight.toFixed(1);
    }

    let brushed = false;
    function toggleBrush() {
      brushed = !brushed;
      const check = document.getElementById('brush-check');
      check.innerText = brushed ? "✓ 已簽到" : "未簽到";
      check.className = brushed ? "text-emerald-600 font-bold" : "text-teal-600";
    }

    let fishoil = false;
    function toggleFishoil() {
      fishoil = !fishoil;
      const check = document.getElementById('fishoil-check');
      check.innerText = fishoil ? "✓ 已簽到" : "未簽到";
      check.className = fishoil ? "text-emerald-600 font-bold" : "text-blue-600";
    }

    let nexgardDone = false;
    function toggleNexgard() {
      nexgardDone = !nexgardDone;
      const btn = document.getElementById('nexgard-btn');
      const status = document.getElementById('nexgard-status');
      if(nexgardDone) {
        btn.innerText = "✓ 已打卡";
        btn.className = "px-3 py-1.5 bg-emerald-600 text-white text-xs font-semibold rounded-lg shadow";
        status.innerText = "🎉 本月驅蟲藥已打卡完成！";
      } else {
        btn.innerText = "打勾簽到";
        btn.className = "px-3 py-1.5 bg-amber-500 hover:bg-amber-600 text-white text-xs font-semibold rounded-lg shadow";
        status.innerText = "點擊打勾打卡紀錄本月吃藥狀態";
      }
    }

    function rollDice() {
      const curRegion = appConfig.regionKey;
      const filteredRests = masterRestaurants.filter(r => r.city === curRegion || (curRegion === "中和" && (r.city === "中和" || r.city === "新北")));
      if(!filteredRests.length) return alert("當前區域暫無餐廳可選！");
      const randIndex = Math.floor(Math.random() * filteredRests.length);
      alert(`🎲 今日推薦：${filteredRests[randIndex].name}`);
    }

    window.onload = function() {
      try {
        const savedC = localStorage.getItem('pet_app_strict_region_v4');
        if (savedC) appConfig = JSON.parse(savedC);
      } catch(e) {}
      
      forceRenderAll();
      renderOutfitsUI();
      renderGallery();
      selectOutfit(outfitsList[0]?.name);
    };
  </script>
</body>
</html>
