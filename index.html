<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>毛孩幸福日常隨身 App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .nav-active { color: #4f46e5; font-weight: bold; }
  </style>
</head>
<body class="bg-amber-50 text-slate-800 min-h-screen pb-20">

  <!-- 頂部 Header -->
  <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-10 flex justify-between items-center">
    <div>
      <h1 id="header-title" class="font-bold text-lg flex items-center space-x-2">
        <span>🐾</span> <span id="header-pet-name">毛孩隨身 App</span>
      </h1>
      <p id="header-address" class="text-xs text-indigo-100 mt-0.5">尚未設定地址 (點擊右上角⚙️設定)</p>
    </div>
    <button onclick="toggleSettingsModal()" class="bg-indigo-500 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-xl text-xs font-bold border border-indigo-400 shadow-sm flex items-center space-x-1">
      <span>⚙️</span> <span>設定</span>
    </button>
  </header>

  <!-- 主內容區域 -->
  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- 1. 散步 Walking 分頁 -->
    <div id="page-walking" class="tab-content space-y-4">
      <!-- 穿搭卡片 -->
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-amber-100 space-y-3">
        <div class="flex justify-between items-center">
          <h2 class="font-bold text-slate-700 flex items-center space-x-1">
            <span>👕</span> <span><span id="outfit-pet-name">毛孩</span> 的今日穿搭</span>
          </h2>
          <button onclick="toggleAddOutfitModal()" class="text-xs text-indigo-600 font-bold hover:underline">+ 新增衣服</button>
        </div>
        
        <div class="flex items-center space-x-4 bg-slate-50 p-3 rounded-xl border border-slate-100">
          <div class="w-16 h-16 bg-amber-100 rounded-full flex items-center justify-center relative overflow-hidden shrink-0 border border-amber-200">
            <span class="text-2xl">🐕</span>
            <svg id="outfit-svg-layer" class="absolute inset-0 w-full h-full" viewBox="0 0 200 200"></svg>
          </div>
          <div>
            <p id="outfit-description" class="text-xs text-slate-600 font-medium">請選擇衣服或試穿新衣服！</p>
          </div>
        </div>

        <div id="outfit-list-grid" class="grid grid-cols-2 gap-2 text-xs"></div>
      </div>

      <!-- 寵物公園 -->
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-amber-100">
        <h2 class="font-bold text-slate-700 mb-3 flex items-center space-x-2">
          <span>🌳</span> <span>周邊 15km 內寵物公園與綠地</span>
        </h2>
        <div id="park-distance-container" class="space-y-2">
          <div class="text-center py-6 text-slate-400 text-xs">請點擊右上角「⚙️ 設定」輸入地址以計算距離</div>
        </div>
      </div>
    </div>

    <!-- 2. 生活 Life 分頁 -->
    <div id="page-life" class="tab-content hidden space-y-4">
      <!-- 寵物友善餐廳 -->
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-amber-100">
        <div class="flex justify-between items-center mb-3">
          <h2 class="font-bold text-slate-700 flex items-center space-x-2">
            <span>🥩</span> <span>周邊 15km 內寵物友善餐廳</span>
          </h2>
          <button onclick="rollDice()" class="bg-indigo-600 text-white text-xs px-2.5 py-1 rounded-lg font-bold shadow-sm">🎲 幫選一個</button>
        </div>
        <div id="restaurant-distance-container" class="space-y-2">
          <div class="text-center py-6 text-slate-400 text-xs">請點擊右上角「⚙️ 設定」輸入地址以計算距離</div>
        </div>
      </div>

      <!-- 動物醫院 -->
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-rose-100">
        <h2 class="font-bold text-slate-700 mb-3 flex items-center space-x-2">
          <span>🏥</span> <span>周邊 15km 內動物醫院與急診</span>
        </h2>
        <div id="vet-distance-container" class="space-y-2">
          <div class="text-center py-6 text-slate-400 text-xs">請點擊右上角「⚙️ 設定」輸入地址以計算距離</div>
        </div>
      </div>
    </div>

    <!-- 3. 健康 Health 分頁 -->
    <div id="page-health" class="tab-content hidden space-y-4">
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-amber-100 space-y-3">
        <h2 class="font-bold text-slate-700 flex items-center space-x-2">
          <span>⚖️</span> <span>體重紀錄</span>
        </h2>
        <div class="flex justify-between items-center bg-slate-50 p-3 rounded-xl">
          <span class="text-xs text-slate-500">目前體重：</span>
          <div class="flex items-center space-x-2">
            <button onclick="adjustWeight(-0.1)" class="w-7 h-7 bg-white border rounded-lg font-bold text-slate-600 shadow-sm">-</button>
            <span id="weight-display" class="font-bold text-lg text-indigo-600">10.0</span> <span class="text-xs text-slate-500">kg</span>
            <button onclick="adjustWeight(0.1)" class="w-7 h-7 bg-white border rounded-lg font-bold text-slate-600 shadow-sm">+</button>
          </div>
        </div>
      </div>

      <div class="bg-white p-4 rounded-2xl shadow-sm border border-amber-100 space-y-3">
        <h2 class="font-bold text-slate-700 flex items-center space-x-2">
          <span>💊</span> <span>日常保健簽到</span>
        </h2>
        <div class="grid grid-cols-2 gap-2 text-xs">
          <button onclick="toggleBrush()" class="p-3 bg-teal-50 border border-teal-100 rounded-xl text-left flex justify-between items-center">
            <div>
              <div class="font-bold text-teal-800">🪥 晚上刷牙</div>
              <p id="brush-check" class="text-teal-600 font-bold mt-0.5">未簽到</p>
            </div>
          </button>
          <button onclick="toggleFishoil()" class="p-3 bg-blue-50 border border-blue-100 rounded-xl text-left flex justify-between items-center">
            <div>
              <div class="font-bold text-blue-800">🐟 魚油保養</div>
              <p id="fishoil-check" class="text-blue-600 font-bold mt-0.5">未簽到</p>
            </div>
          </button>
        </div>
      </div>

      <div class="bg-white p-4 rounded-2xl shadow-sm border border-amber-100 space-y-2">
        <div class="flex justify-between items-center">
          <h2 class="font-bold text-slate-700 flex items-center space-x-1">
            <span>🛡️</span> <span>本月驅蟲藥紀錄</span>
          </h2>
          <button id="nexgard-btn" onclick="toggleNexgard()" class="px-3 py-1.5 bg-amber-500 hover:bg-amber-600 text-white text-xs font-semibold rounded-lg shadow">打勾簽到</button>
        </div>
        <p id="nexgard-status" class="text-xs text-slate-500">點擊打勾打卡紀錄本月吃藥狀態</p>
      </div>
    </div>

    <!-- 4. 相片 Gallery 分頁 -->
    <div id="page-gallery" class="tab-content hidden space-y-4">
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-amber-100 space-y-3">
        <div class="flex justify-between items-center">
          <h2 class="font-bold text-slate-700 flex items-center space-x-2">
            <span>🖼️</span> <span>毛孩生活相廊</span>
          </h2>
          <label class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-3 py-1.5 rounded-xl font-bold cursor-pointer shadow-sm">
            + 上傳照片
            <input type="file" accept="image/*" class="hidden" onchange="handlePhotoUpload(event)">
          </label>
        </div>
        <div id="photo-gallery" class="grid grid-cols-2 gap-2"></div>
      </div>
    </div>

  </main>

  <!-- 底部導覽列 -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-4 py-2 flex justify-around items-center text-xs text-slate-400 z-10">
    <button id="nav-walking" onclick="switchTab('walking')" class="nav-item nav-active flex flex-col items-center">
      <span class="text-lg">🐕</span> <span>散步 Walking</span>
    </button>
    <button id="nav-life" onclick="switchTab('life')" class="nav-item flex flex-col items-center">
      <span class="text-lg">🍖</span> <span>生活 Life</span>
    </button>
    <button id="nav-health" onclick="switchTab('health')" class="nav-item flex flex-col items-center">
      <span class="text-lg">💊</span> <span>健康 Health</span>
    </button>
    <button id="nav-gallery" onclick="switchTab('gallery')" class="nav-item flex flex-col items-center">
      <span class="text-lg">📸</span> <span>相廊 Gallery</span>
    </button>
  </nav>

  <!-- 設定 Modal -->
  <div id="settings-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-sm w-full p-5 space-y-4 shadow-xl">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-slate-800">⚙️ 寵物與住址設定</h3>
        <button onclick="toggleSettingsModal()" class="text-slate-400 hover:text-slate-600 font-bold">✕</button>
      </div>
      <div class="space-y-3 text-xs">
        <div>
          <label class="block font-bold text-slate-600 mb-1">寶貝名字</label>
          <input id="input-pet-name" type="text" placeholder="例如：55" class="w-full p-2.5 border rounded-xl outline-indigo-500">
        </div>
        <div>
          <label class="block font-bold text-slate-600 mb-1">住址 (全台灣皆可輸入)</label>
          <input id="input-address" type="text" placeholder="例如：台中市西屯區文華路100號" class="w-full p-2.5 border rounded-xl outline-indigo-500">
        </div>
        <div>
          <label class="block font-bold text-slate-600 mb-1">Google Maps API Key (填入可啟用全台動態搜尋)</label>
          <input id="input-api-key" type="text" placeholder="選填：AIzaSy..." class="w-full p-2.5 border rounded-xl outline-indigo-500">
        </div>
      </div>
      <div class="space-y-2 pt-2">
        <button onclick="saveSettings()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl shadow-md text-xs">💾 儲存並更新地點距離</button>
        <button onclick="resetAppCache()" class="w-full py-2 bg-slate-100 text-slate-500 font-semibold rounded-2xl text-xs">🔄 清空本地紀錄</button>
      </div>
    </div>
  </div>

  <script>
    let masterParks = [];
    let masterRestaurants = [];
    let masterVets = [];

    let appConfig = { petName: "", address: "", apiKey: "", userLat: null, userLng: null };
    let outfitsList = [
      { name: "粉紅色長袖", color: "#ec4899", desc: "💗 經典粉紅保暖外套，軟萌又暖呼呼！" },
      { name: "條紋長袖", color: "#ef4444", desc: "👕 經典紅白條紋長袖，簡約亮眼！" },
      { name: "無袖涼感衣", color: "#06b6d4", desc: "❄️ 薄荷綠防曬涼感背心，透氣排汗首選！" },
      { name: "今天不穿衣服", color: "#1e293b", desc: "🐕 自然裸奔款！展示帥氣順滑毛髮！" }
    ];
    let photosList = [];

    // 動態讀取外部 json 資料庫
    async function loadPlacesDatabase() {
      try {
        const res = await fetch('places.json');
        const data = await res.json();
        masterParks = data.parks || [];
        masterRestaurants = data.restaurants || [];
        masterVets = data.vets || [];
      } catch (err) {
        console.warn("未發現 places.json，將使用預設數據");
      }
    }

    function isOpenNow(openHour, closeHour) {
      const now = new Date();
      const currentHour = now.getHours() + (now.getMinutes() / 60);
      if (openHour === 0 && closeHour === 24) return true;
      if (closeHour > 24) {
        return currentHour >= openHour || currentHour <= (closeHour - 24);
      }
      return currentHour >= openHour && currentHour <= closeHour;
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('nav-active'));
      document.getElementById(`page-${tabName}`).classList.remove('hidden');
      document.getElementById(`nav-${tabName}`).classList.add('nav-active');
    }

    function toggleSettingsModal() {
      const modal = document.getElementById('settings-modal');
      modal.classList.toggle('hidden');
      if (!modal.classList.contains('hidden')) {
        document.getElementById('input-pet-name').value = appConfig.petName || '';
        document.getElementById('input-address').value = appConfig.address || '';
        document.getElementById('input-api-key').value = appConfig.apiKey || '';
      }
    }

    function getDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return (R * c).toFixed(1);
    }

    function getCityFallbackCoords(addr) {
      if (!addr) return null;
      if (addr.includes("中和")) return { lat: 24.9920, lng: 121.5170 };
      if (addr.includes("板橋")) return { lat: 25.0135, lng: 121.4630 };
      if (addr.includes("台北") || addr.includes("臺北")) return { lat: 25.0330, lng: 121.5654 };
      if (addr.includes("台中") || addr.includes("臺中") || addr.includes("西屯")) return { lat: 24.1800, lng: 120.6450 };
      if (addr.includes("高雄") || addr.includes("鼓山")) return { lat: 22.6273, lng: 120.3014 };
      return { lat: 25.0330, lng: 121.5654 };
    }

    async function geocodeAddress(addressText) {
      if (!addressText) return null;
      try {
        const query = addressText.includes("台灣") ? addressText : `台灣${addressText}`;
        const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`;
        const res = await fetch(url, { headers: { 'Accept-Language': 'zh-TW' } });
        const data = await res.json();
        if (data && data.length > 0) return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
      } catch (err) {}
      return getCityFallbackCoords(addressText);
    }

    async function saveSettings() {
      appConfig.petName = (document.getElementById('input-pet-name').value || '').trim();
      appConfig.address = (document.getElementById('input-address').value || '').trim();
      appConfig.apiKey = (document.getElementById('input-api-key').value || '').trim();

      if (appConfig.address) {
        document.getElementById('header-address').innerText = "📍 定位計算中...";
        let coords = await geocodeAddress(appConfig.address);
        if (coords) {
          appConfig.userLat = coords.lat;
          appConfig.userLng = coords.lng;
        }
      }

      localStorage.setItem('pet_app_json_v9', JSON.stringify(appConfig));
      forceRenderAll();
      toggleSettingsModal();
    }

    function resetAppCache() {
      localStorage.removeItem('pet_app_json_v9');
      appConfig = { petName: "", address: "", apiKey: "", userLat: null, userLng: null };
      forceRenderAll();
      toggleSettingsModal();
    }

    function forceRenderAll() {
      const pName = appConfig.petName || "毛孩";
      const pAddr = appConfig.address || "尚未設定地址 (點擊右上角⚙️設定)";

      document.getElementById('header-pet-name').innerText = appConfig.petName ? `${pName}的隨身 App` : "毛孩隨身 App";
      document.getElementById('header-address').innerText = pAddr;
      document.getElementById('outfit-pet-name').innerText = pName;

      if (!appConfig.userLat || !appConfig.userLng) {
        const emptyTip = `<div class="text-center py-6 text-slate-400 text-xs">請點擊右上角「⚙️ 設定」輸入地址以計算距離</div>`;
        document.getElementById('park-distance-container').innerHTML = emptyTip;
        document.getElementById('restaurant-distance-container').innerHTML = emptyTip;
        document.getElementById('vet-distance-container').innerHTML = emptyTip;
        return;
      }

      const maxDistanceKm = 15;

      // 1. 公園
      const filteredParks = masterParks
        .map(p => ({ ...p, dist: parseFloat(getDistanceKm(appConfig.userLat, appConfig.userLng, p.lat, p.lng)) }))
        .filter(p => p.dist <= maxDistanceKm && isOpenNow(p.open, p.close))
        .sort((a, b) => a.dist - b.dist);

      document.getElementById('park-distance-container').innerHTML = filteredParks.length ? filteredParks.map((p, idx) => `
        <div class="p-3 rounded-xl border border-slate-100 bg-slate-50 flex justify-between items-center my-2">
          <div>
            <div class="font-bold text-slate-800 flex items-center space-x-1">
              <span>${idx + 1}. ${p.name}</span>
              <span class="text-[10px] bg-indigo-100 text-indigo-700 px-1.5 py-0.5 rounded font-bold">📍 距約 ${p.dist} km</span>
              <span class="text-[10px] bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded font-bold">🟢 營業中</span>
            </div>
            <p class="text-slate-500 text-[11px] mt-0.5">${p.desc}</p>
          </div>
          <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name)}" target="_blank" class="px-2.5 py-1.5 bg-emerald-600 text-white font-bold rounded-lg text-[11px] shadow-sm shrink-0">🗺️ 導航</a>
        </div>
      `).join('') : `<div class="text-center py-4 text-slate-400 text-xs">附近 15km 內暫無符合公園，建議於設定填入 Google API Key 以動態擴充</div>`;

      // 2. 餐廳
      const filteredRests = masterRestaurants
        .map(r => ({ ...r, dist: parseFloat(getDistanceKm(appConfig.userLat, appConfig.userLng, r.lat, r.lng)) }))
        .filter(r => r.dist <= maxDistanceKm && isOpenNow(r.open, r.close))
        .sort((a, b) => a.dist - b.dist);

      document.getElementById('restaurant-distance-container').innerHTML = filteredRests.length ? filteredRests.map((r, idx) => `
        <div class="p-3 rounded-xl border border-slate-100 bg-slate-50 flex justify-between items-center my-2">
          <div>
            <div class="font-bold text-slate-800 flex items-center space-x-1">
              <span>${idx + 1}. ${r.name}</span>
              <span class="text-amber-600 font-bold text-[10px]">📍 距約 ${r.dist} km</span>
              <span class="text-[10px] bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded font-bold">🟢 營業中</span>
            </div>
            <p class="text-slate-500 text-[11px] mt-0.5">${r.desc}</p>
          </div>
          <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(r.name)}" target="_blank" class="px-2.5 py-1.5 bg-emerald-600 text-white font-bold rounded-lg text-[11px] shadow-sm shrink-0">🗺️ 導航</a>
        </div>
      `).join('') : `<div class="text-center py-4 text-slate-400 text-xs">附近 15km 內暫無符合餐廳，建議於設定填入 Google API Key 以動態擴充</div>`;

      // 3. 醫院
      const filteredVets = masterVets
        .map(v => ({ ...v, dist: parseFloat(getDistanceKm(appConfig.userLat, appConfig.userLng, v.lat, v.lng)) }))
        .filter(v => v.dist <= maxDistanceKm && isOpenNow(v.open, v.close))
        .sort((a, b) => a.dist - b.dist);

      document.getElementById('vet-distance-container').innerHTML = filteredVets.length ? filteredVets.map((v, idx) => `
        <div class="p-3 rounded-xl border border-rose-100 bg-rose-50/50 flex justify-between items-center my-2">
          <div>
            <div class="font-bold text-slate-800 flex items-center space-x-1">
              <span>${v.name}</span>
              <span class="text-rose-700 text-[10px] font-bold bg-rose-100 px-1.5 py-0.5 rounded">📍 距約 ${v.dist} km</span>
              <span class="text-[10px] bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded font-bold">🟢 營業中</span>
            </div>
            <p class="text-slate-500 text-[11px] mt-0.5">${v.desc}</p>
          </div>
          <a href="tel:${v.phone}" class="px-2.5 py-1.5 bg-rose-600 text-white font-bold rounded-lg text-[11px] shadow-sm shrink-0">📞 直撥</a>
        </div>
      `).join('') : `<div class="text-center py-4 text-slate-400 text-xs">附近 15km 內暫無符合動物醫院</div>`;
    }

    window.onload = async function() {
      try {
        const savedC = localStorage.getItem('pet_app_json_v9');
        if (savedC) appConfig = JSON.parse(savedC);
      } catch(e) {}

      await loadPlacesDatabase();
      forceRenderAll();
    };
  </script>
</body>
</html>
